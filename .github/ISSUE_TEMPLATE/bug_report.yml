name: Bug report
description: Report a reproducible problem in Art-Generator
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the repository commit and a minimal example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, toolchain, browser or device, as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials and personal data before posting.
